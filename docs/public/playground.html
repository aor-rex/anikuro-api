<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anikuro api playground</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a;
      --bg2: #1a1a1a;
      --bg3: #2a2a2a;
      --accent: #cc0000;
      --accent-glow: rgba(204, 0, 0, 0.3);
      --text: #f0f0f0;
      --text-dim: #808080;
      --border: #333;
      --success: #22c55e;
      --error: #ef4444;
    }
    body {
      font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 50%, #0a0a0a 100%);
      border-bottom: 2px solid var(--accent);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .header h1 {
      font-size: 1.5rem;
      background: linear-gradient(90deg, #ff3333, #f0f0f0);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .tag {
      background: var(--accent);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .base-url-group {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .base-url-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .base-url-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .base-url-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .endpoint {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .endpoint:hover { border-color: var(--accent); }
    .endpoint-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      cursor: pointer;
      user-select: none;
    }
    .method {
      background: var(--accent);
      color: white;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      min-width: 48px;
      text-align: center;
    }
    .path {
      font-family: monospace;
      font-size: 0.9rem;
      flex: 1;
    }
    .description {
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .endpoint-body { padding: 0 1rem 1rem; }
    .param-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      align-items: center;
    }
    .param-row label {
      min-width: 100px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .param-row input, .param-row select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .param-row input:focus, .param-row select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn {
      background: linear-gradient(135deg, #cc0000, #990000);
      color: white;
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      font-size: 0.85rem;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .btn:active { transform: translateY(0); }
    .response-area {
      margin-top: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      max-height: 400px;
      overflow: auto;
      font-family: monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .status-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
    }
    .status-code {
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 700;
    }
    .status-ok { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .status-err { background: rgba(239, 68, 68, 0.2); color: var(--error); }
    .response-time { color: var(--text-dim); }
    .loading { color: var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .section-title {
      font-size: 1.1rem;
      color: var(--text);
      margin: 2rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>anikuro api playground</h1>
    <span class="tag">live</span>
  </div>

  <div class="container">
    <div class="base-url-group">
      <label>base url</label>
      <input type="text" id="baseUrl" value="https://aor-rex-anikuro-api.hf.space" placeholder="enter base url">
    </div>

    <h2 class="section-title">manga list</h2>
    <div class="endpoint" id="ep-list">
      <div class="endpoint-header">
        <span class="method">GET</span>
        <span class="path">/api/manga/list</span>
        <span class="description">fetch a list of manga</span>
      </div>
      <div class="endpoint-body">
        <div class="param-row">
          <label>type</label>
          <select id="list-type">
            <option value="">any</option>
            <option value="newest">newest</option>
            <option value="latest">latest</option>
            <option value="topview">top viewed</option>
          </select>
        </div>
        <div class="param-row">
          <label>state</label>
          <select id="list-state">
            <option value="">any</option>
            <option value="ongoing">ongoing</option>
            <option value="completed">completed</option>
          </select>
        </div>
        <div class="param-row">
          <label>category</label>
          <select id="list-category">
            <option value="">all</option>
            <option value="action">action</option>
            <option value="adventure">adventure</option>
            <option value="comedy">comedy</option>
            <option value="drama">drama</option>
            <option value="fantasy">fantasy</option>
            <option value="romance">romance</option>
            <option value="scifi">sci-fi</option>
          </select>
        </div>
        <div class="param-row">
          <label>page</label>
          <input type="number" id="list-page" value="1" min="1">
        </div>
        <button class="btn" onclick="sendList()">send request</button>
        <div id="list-result"></div>
      </div>
    </div>

    <h2 class="section-title">manga detail</h2>
    <div class="endpoint" id="ep-detail">
      <div class="endpoint-header">
        <span class="method">GET</span>
        <span class="path">/api/manga/:id</span>
        <span class="description">get manga details by id</span>
      </div>
      <div class="endpoint-body">
        <div class="param-row">
          <label>manga id</label>
          <input type="text" id="detail-id" value="manga-oa952283" placeholder="manga-oa952283">
        </div>
        <button class="btn" onclick="sendDetail()">send request</button>
        <div id="detail-result"></div>
      </div>
    </div>

    <h2 class="section-title">search</h2>
    <div class="endpoint" id="ep-search">
      <div class="endpoint-header">
        <span class="method">GET</span>
        <span class="path">/api/manga/search/:query</span>
        <span class="description">search manga by title</span>
      </div>
      <div class="endpoint-body">
        <div class="param-row">
          <label>query</label>
          <input type="text" id="search-query" value="attack on titan" placeholder="search term">
        </div>
        <div class="param-row">
          <label>page</label>
          <input type="number" id="search-page" value="1" min="1">
        </div>
        <button class="btn" onclick="sendSearch()">send request</button>
        <div id="search-result"></div>
      </div>
    </div>

    <h2 class="section-title">chapter</h2>
    <div class="endpoint" id="ep-chapter">
      <div class="endpoint-header">
        <span class="method">GET</span>
        <span class="path">/api/manga/:id/:ch</span>
        <span class="description">get chapter details and images</span>
      </div>
      <div class="endpoint-body">
        <div class="param-row">
          <label>manga id</label>
          <input type="text" id="chapter-manga-id" value="manga-oa952283" placeholder="manga id">
        </div>
        <div class="param-row">
          <label>chapter id</label>
          <input type="text" id="chapter-id" value="chapter-139" placeholder="chapter-139">
        </div>
        <button class="btn" onclick="sendChapter()">send request</button>
        <div id="chapter-result"></div>
      </div>
    </div>
  </div>

  <script>
    async function fetchEndpoint(url, resultId) {
      const resultEl = document.getElementById(resultId);
      const baseUrl = document.getElementById('baseUrl').value.replace(/\/$/, '');
      const fullUrl = baseUrl + url;

      resultEl.innerHTML = '<div class="status-bar"><span class="loading">sending request...</span></div><div class="response-area">loading...</div>';

      const start = performance.now();
      try {
        const res = await fetch(fullUrl);
        const duration = Math.round(performance.now() - start);
        const data = await res.json();

        resultEl.innerHTML = `
          <div class="status-bar">
            <span class="status-code ${res.ok ? 'status-ok' : 'status-err'}">${res.status} ${res.statusText}</span>
            <span class="response-time">${duration}ms</span>
          </div>
          <div class="response-area">${JSON.stringify(data, null, 2)}</div>
        `;
      } catch (err) {
        resultEl.innerHTML = `
          <div class="status-bar">
            <span class="status-code status-err">error</span>
          </div>
          <div class="response-area">${JSON.stringify({ error: err.message }, null, 2)}</div>
        `;
      }
    }

    function buildParams(params) {
      const qs = new URLSearchParams(params).toString();
      return qs ? '?' + qs : '';
    }

    function sendList() {
      const params = {};
      const type = document.getElementById('list-type').value;
      const state = document.getElementById('list-state').value;
      const category = document.getElementById('list-category').value;
      const page = document.getElementById('list-page').value;
      if (type) params.type = type;
      if (state) params.state = state;
      if (category) params.category = category;
      if (page) params.page = page;
      fetchEndpoint('/api/manga/list' + buildParams(params), 'list-result');
    }

    function sendDetail() {
      const id = document.getElementById('detail-id').value;
      fetchEndpoint('/api/manga/' + id, 'detail-result');
    }

    function sendSearch() {
      const query = encodeURIComponent(document.getElementById('search-query').value);
      const page = document.getElementById('search-page').value;
      fetchEndpoint('/api/manga/search/' + query + '?page=' + page, 'search-result');
    }

    function sendChapter() {
      const mangaId = document.getElementById('chapter-manga-id').value;
      const chapterId = document.getElementById('chapter-id').value;
      fetchEndpoint('/api/manga/' + mangaId + '/' + chapterId, 'chapter-result');
    }
  </script>
</body>
</html>
