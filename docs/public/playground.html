<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anikuro api playground</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #0a0a0a;
        --bg2: #141414;
        --bg3: #1e1e1e;
        --accent: #cc0000;
        --accent-glow: rgba(204, 0, 0, 0.3);
        --text: #f0f0f0;
        --text-dim: #888;
        --border: #2a2a2a;
        --green: #22c55e;
        --red: #ef4444;
      }
      body {
        font-family: "Noto Sans JP", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .header {
        background: linear-gradient(135deg, #0a0a0a, #1a0000, #0a0a0a);
        border-bottom: 2px solid var(--accent);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .header h1 {
        font-size: 1.4rem;
        background: linear-gradient(90deg, #ff3333, #fff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .tag {
        background: var(--accent);
        color: #fff;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: 700;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.5rem 1rem;
        display: flex;
        gap: 1rem;
      }
      .sidebar {
        width: 160px;
        flex-shrink: 0;
      }
      .sidebar button {
        display: block;
        width: 100%;
        padding: 0.6rem 1rem;
        background: none;
        border: none;
        color: var(--text-dim);
        text-align: left;
        cursor: pointer;
        border-radius: 6px;
        font-size: 0.85rem;
        margin-bottom: 2px;
        transition: all 0.15s;
      }
      .sidebar button:hover,
      .sidebar button.active {
        background: var(--bg3);
        color: var(--text);
      }
      .sidebar button.active {
        color: #ff4444;
        border-left: 3px solid var(--accent);
      }
      .main {
        flex: 1;
        min-width: 0;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }

      .base-url-bar {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .base-url-bar label {
        font-size: 0.75rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        white-space: nowrap;
      }
      .base-url-bar input {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        font-family: monospace;
        font-size: 0.85rem;
      }
      .base-url-bar input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-glow);
      }

      .card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .endpoint-line {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .method-badge {
        background: var(--accent);
        color: #fff;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: 700;
      }
      .path-text {
        font-family: monospace;
        font-size: 0.9rem;
        color: #f0f0f0;
      }
      .param-row {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .param-row label {
        min-width: 80px;
        font-size: 0.8rem;
        color: var(--text-dim);
      }
      .param-row input,
      .param-row select {
        flex: 1;
        min-width: 120px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.5rem;
        border-radius: 4px;
        font-size: 0.85rem;
      }
      .param-row input:focus,
      .param-row select:focus {
        outline: none;
        border-color: var(--accent);
      }
      .btn {
        background: linear-gradient(135deg, #cc0000, #990000);
        color: #fff;
        border: none;
        padding: 0.5rem 1.25rem;
        border-radius: 6px;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.15s;
      }
      .btn:hover {
        box-shadow: 0 4px 12px var(--accent-glow);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: none;
      }

      .resp-area {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.75rem;
        margin-top: 0.5rem;
        font-family: monospace;
        font-size: 0.8rem;
        max-height: 500px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .status-line {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.5rem;
        font-size: 0.8rem;
      }
      .status-ok {
        background: rgba(34, 197, 94, 0.15);
        color: var(--green);
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 700;
      }
      .status-err {
        background: rgba(239, 68, 68, 0.15);
        color: var(--red);
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 700;
      }
      .loading {
        color: var(--accent);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .manga-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 0.75rem;
        margin-top: 0.5rem;
      }
      .manga-card {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.2s;
      }
      .manga-card:hover {
        border-color: var(--accent);
        box-shadow: 0 4px 12px var(--accent-glow);
        transform: translateY(-2px);
      }
      .manga-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }
      .manga-card .info {
        padding: 0.5rem;
      }
      .manga-card .title {
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1.2;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .manga-card .ch {
        font-size: 0.7rem;
        color: var(--text-dim);
        margin-top: 2px;
      }

      .detail-header {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .detail-cover {
        width: 150px;
        border-radius: 8px;
      }
      .detail-meta h2 {
        font-size: 1.2rem;
        margin-bottom: 0.5rem;
      }
      .detail-meta p {
        font-size: 0.8rem;
        color: var(--text-dim);
        margin-bottom: 0.25rem;
      }
      .detail-meta .genres span {
        display: inline-block;
        background: var(--bg3);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        margin-right: 4px;
        margin-top: 4px;
      }

      .chapter-list {
        max-height: 400px;
        overflow-y: auto;
      }
      .chapter-item {
        padding: 0.5rem;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.15s;
        font-size: 0.8rem;
      }
      .chapter-item:hover {
        background: var(--bg3);
      }

      .reader-view {
        text-align: center;
      }
      .reader-view img {
        max-width: 100%;
        height: auto;
        margin-bottom: 4px;
      }
      .reader-nav {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>anikuro api playground</h1>
      <span class="tag">interactive</span>
    </div>

    <div
      class="base-url-bar"
      style="max-width: 1200px; margin: 1rem auto 0; padding: 0.75rem 1rem"
    >
      <label>base url</label>
      <input
        type="text"
        id="baseUrl"
        value="https://aor-rex-anikuro-api.hf.space"
        placeholder="enter base url"
      />
    </div>

    <div class="container">
      <div class="sidebar">
        <button class="active" onclick="show('list', this)">manga list</button>
        <button onclick="show('search', this)">search</button>
        <button onclick="show('detail', this)">manga detail</button>
        <button onclick="show('reader', this)">chapter reader</button>
        <button onclick="show('raw', this)">raw json</button>
      </div>

      <div class="main">
        <!-- LIST PANEL -->
        <div class="panel active" id="panel-list">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/manga/list</span>
            </div>
            <div class="param-row">
              <label>category</label>
              <select id="list-cat">
                <option value="">all</option>
                <option value="action">action</option>
                <option value="adventure">adventure</option>
                <option value="comedy">comedy</option>
                <option value="drama">drama</option>
                <option value="fantasy">fantasy</option>
                <option value="romance">romance</option>
                <option value="scifi">sci-fi</option>
                <option value="mystery">mystery</option>
                <option value="horror">horror</option>
                <option value="isekai">isekai</option>
                <option value="slice+of+life">slice of life</option>
                <option value="sports">sports</option>
              </select>
            </div>
            <div class="param-row">
              <label>page</label>
              <input
                type="number"
                id="list-page"
                value="1"
                min="1"
                style="max-width: 80px"
              />
            </div>
            <button class="btn" onclick="fetchList()">fetch</button>
          </div>
          <div id="list-output"></div>
        </div>

        <!-- SEARCH PANEL -->
        <div class="panel" id="panel-search">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/manga/search/:query</span>
            </div>
            <div class="param-row">
              <label>query</label>
              <input
                type="text"
                id="search-q"
                value="attack on titan"
                placeholder="search term"
              />
            </div>
            <div class="param-row">
              <label>page</label>
              <input
                type="number"
                id="search-page"
                value="1"
                min="1"
                style="max-width: 80px"
              />
            </div>
            <button class="btn" onclick="fetchSearch()">search</button>
          </div>
          <div id="search-output"></div>
        </div>

        <!-- DETAIL PANEL -->
        <div class="panel" id="panel-detail">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/manga/:id</span>
            </div>
            <div class="param-row">
              <label>manga id</label>
              <input
                type="text"
                id="detail-id"
                value="attack-on-titan"
                placeholder="manga slug"
              />
            </div>
            <button class="btn" onclick="fetchDetail()">fetch</button>
          </div>
          <div id="detail-output"></div>
        </div>

        <!-- READER PANEL -->
        <div class="panel" id="panel-reader">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/manga/:id/:ch</span>
            </div>
            <div class="param-row">
              <label>manga id</label>
              <input
                type="text"
                id="reader-manga"
                value="attack-on-titan"
                placeholder="manga slug"
              />
            </div>
            <div class="param-row">
              <label>chapter</label>
              <input
                type="text"
                id="reader-ch"
                value="chapter-139"
                placeholder="chapter slug"
              />
            </div>
            <button class="btn" onclick="fetchChapter()">load chapter</button>
          </div>
          <div id="reader-output"></div>
        </div>

        <!-- RAW JSON PANEL -->
        <div class="panel" id="panel-raw">
          <div class="card">
            <div class="param-row">
              <label>endpoint</label>
              <input
                type="text"
                id="raw-url"
                value="/api/manga/list"
                placeholder="/api/manga/list"
              />
            </div>
            <button class="btn" onclick="fetchRaw()">send</button>
          </div>
          <div id="raw-output"></div>
        </div>
      </div>
    </div>

    <script>
      function base() {
        return document.getElementById("baseUrl").value.replace(/\/$/, "");
      }
      function show(name, btn) {
        document
          .querySelectorAll(".panel")
          .forEach((p) => p.classList.remove("active"));
        document
          .querySelectorAll(".sidebar button")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById("panel-" + name).classList.add("active");
        if (btn) btn.classList.add("active");
      }
      function statusHTML(ok, status, time) {
        return (
          '<div class="status-line"><span class="' +
          (ok ? "status-ok" : "status-err") +
          '">' +
          status +
          '</span><span style="color:#888">' +
          time +
          "ms</span></div>"
        );
      }
      function loading() {
        return '<div class="status-line"><span class="loading">fetching...</span></div>';
      }
      function errHTML(e) {
        return (
          statusHTML(false, "ERROR", 0) +
          '<div class="resp-area">' +
          e +
          "</div>"
        );
      }

      function mangaGridHTML(list) {
        if (!list || !list.length)
          return '<p style="color:#888;margin-top:1rem">no results found</p>';
        let html = '<div class="manga-grid">';
        list.forEach(function (m) {
          var img = m.image || m.imageUrl || "";
          var title = m.title || m.name || "unknown";
          var ch = m.chapter || m.currentChapter || "";
          html +=
            '<div class="manga-card" onclick="openDetail(\'' +
            (m.id || "") +
            "')\">";
          if (img)
            html +=
              '<img src="' +
              img +
              '" loading="lazy" onerror="this.style.display=\'none\'">';
          html += '<div class="info"><div class="title">' + title + "</div>";
          if (ch) html += '<div class="ch">' + ch + "</div>";
          html += "</div></div>";
        });
        html += "</div>";
        return html;
      }

      /* LIST */
      function fetchList() {
        var cat = document.getElementById("list-cat").value;
        var page = document.getElementById("list-page").value;
        var params = "?page=" + page;
        if (cat) params += "&category=" + cat;
        var url = base() + "/api/manga/list" + params;
        document.getElementById("list-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            return r.json().then(function (d) {
              return [r, d];
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            document.getElementById("list-output").innerHTML =
              statusHTML(r.ok, r.status, ms) + mangaGridHTML(d.mangaList);
          })
          .catch(function (e) {
            document.getElementById("list-output").innerHTML = errHTML(
              e.message,
            );
          });
      }

      /* SEARCH */
      function fetchSearch() {
        var q = encodeURIComponent(document.getElementById("search-q").value);
        var page = document.getElementById("search-page").value;
        var url = base() + "/api/manga/search/" + q + "?page=" + page;
        document.getElementById("search-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            return r.json().then(function (d) {
              return [r, d];
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            document.getElementById("search-output").innerHTML =
              statusHTML(r.ok, r.status, ms) + mangaGridHTML(d.mangaList);
          })
          .catch(function (e) {
            document.getElementById("search-output").innerHTML = errHTML(
              e.message,
            );
          });
      }

      /* DETAIL */
      function openDetail(id) {
        show("detail");
        document.getElementById("detail-id").value = id;
        fetchDetail();
      }

      function fetchDetail() {
        var id = document.getElementById("detail-id").value;
        var url = base() + "/api/manga/" + id;
        document.getElementById("detail-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            return r.json().then(function (d) {
              return [r, d];
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            var html = statusHTML(r.ok, r.status, ms);

            if (d.name) {
              html += '<div class="card"><div class="detail-header">';
              if (d.imageUrl)
                html +=
                  '<img class="detail-cover" src="' +
                  d.imageUrl +
                  '" onerror="this.style.display=\'none\'">';
              html += '<div class="detail-meta"><h2>' + d.name + "</h2>";
              if (d.author)
                html += "<p><strong>author:</strong> " + d.author + "</p>";
              if (d.status)
                html += "<p><strong>status:</strong> " + d.status + "</p>";
              if (d.updated)
                html += "<p><strong>updated:</strong> " + d.updated + "</p>";
              if (d.genres)
                html +=
                  '<div class="genres">' +
                  d.genres
                    .map(function (g) {
                      return "<span>" + g + "</span>";
                    })
                    .join("") +
                  "</div>";
              html += "</div></div>";

              if (d.chapterList && d.chapterList.length) {
                html +=
                  '<h3 style="margin-bottom:0.5rem;font-size:0.95rem;">chapters (' +
                  d.chapterList.length +
                  ")</h3>";
                html += '<div class="chapter-list">';
                d.chapterList.forEach(function (ch) {
                  html +=
                    '<div class="chapter-item" onclick="openChapter(\'' +
                    id +
                    "','" +
                    ch.id +
                    "')\">";
                  html += ch.name || ch.id;
                  if (ch.view)
                    html +=
                      ' <span style="color:#888">(' + ch.view + ")</span>";
                  html += "</div>";
                });
                html += "</div>";
              }
              html += "</div>";
            } else {
              html +=
                '<div class="resp-area">' +
                JSON.stringify(d, null, 2) +
                "</div>";
            }
            document.getElementById("detail-output").innerHTML = html;
          })
          .catch(function (e) {
            document.getElementById("detail-output").innerHTML = errHTML(
              e.message,
            );
          });
      }

      /* CHAPTER / READER */
      function openChapter(mangaId, chId) {
        show("reader");
        document.getElementById("reader-manga").value = mangaId;
        document.getElementById("reader-ch").value = chId;
        fetchChapter();
      }

      function fetchChapter() {
        var mangaId = document.getElementById("reader-manga").value;
        var chId = document.getElementById("reader-ch").value;
        var url = base() + "/api/manga/" + mangaId + "/" + chId;
        document.getElementById("reader-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            return r.json().then(function (d) {
              return [r, d];
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            var html = statusHTML(r.ok, r.status, ms);

            if (d.title) {
              html += '<div class="card">';
              html += '<h3 style="margin-bottom:0.5rem">' + d.title + "</h3>";
              if (d.currentChapter)
                html +=
                  '<p style="color:#888;margin-bottom:1rem;font-size:0.85rem">' +
                  d.currentChapter +
                  "</p>";

              if (d.chapterListIds && d.chapterListIds.length) {
                html +=
                  '<div class="param-row" style="margin-bottom:1rem"><label>jump to chapter</label>';
                html +=
                  "<select onchange=\"document.getElementById('reader-ch').value=this.value;fetchChapter()\">";
                d.chapterListIds.forEach(function (ch) {
                  html +=
                    '<option value="' +
                    ch.id +
                    '" ' +
                    (ch.id === chId ? "selected" : "") +
                    ">" +
                    (ch.name || ch.id) +
                    "</option>";
                });
                html += "</select></div>";
              }

              if (d.images && d.images.length) {
                html += '<div class="reader-view">';
                d.images.forEach(function (img) {
                  html +=
                    '<img src="' +
                    img.image +
                    '" alt="' +
                    (img.title || "") +
                    '" loading="lazy">';
                });
                html += "</div>";
              } else {
                html +=
                  '<div class="resp-area">' +
                  JSON.stringify(d, null, 2) +
                  "</div>";
              }
              html += "</div>";
            } else {
              html +=
                '<div class="resp-area">' +
                JSON.stringify(d, null, 2) +
                "</div>";
            }
            document.getElementById("reader-output").innerHTML = html;
          })
          .catch(function (e) {
            document.getElementById("reader-output").innerHTML = errHTML(
              e.message,
            );
          });
      }

      /* RAW */
      function fetchRaw() {
        var path = document.getElementById("raw-url").value;
        var url = base() + path;
        document.getElementById("raw-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            return r.json().then(function (d) {
              return [r, d];
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            document.getElementById("raw-output").innerHTML =
              statusHTML(r.ok, r.status, ms) +
              '<div class="resp-area">' +
              JSON.stringify(d, null, 2) +
              "</div>";
          })
          .catch(function (e) {
            document.getElementById("raw-output").innerHTML = errHTML(
              e.message,
            );
          });
      }

      /* initial load */
      fetchList();
    </script>
  </body>
</html>
