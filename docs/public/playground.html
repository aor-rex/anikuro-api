<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anikuro api playground</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #000000;
        --bg2: #0a0a0a;
        --bg3: #141414;
        --accent: #cc0000;
        --accent-glow: rgba(204, 0, 0, 0.3);
        --text: #f5f5f5;
        --text-dim: #808080;
        --border: #2a2a2a;
        --green: #22c55e;
        --red: #ef4444;
      }
      body {
        font-family: "Outfit", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .header {
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        padding: 0.6rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .header h1 {
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #ff3333;
        text-transform: lowercase;
      }
      .tag {
        background: var(--accent);
        color: #fff;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: 700;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.5rem 1rem;
        display: flex;
        gap: 1rem;
      }
      .sidebar {
        width: 160px;
        flex-shrink: 0;
      }
      /* Hide hamburger on desktop */
      .menu-toggle {
        display: none;
      }
      .menu-backdrop {
        display: none;
      }
      .sidebar button {
        display: block;
        width: 100%;
        padding: 0.6rem 1rem;
        background: none;
        border: none;
        color: var(--text-dim);
        text-align: left;
        cursor: pointer;
        border-radius: 6px;
        font-size: 0.85rem;
        margin-bottom: 2px;
        transition: all 0.15s;
      }
      .sidebar button:hover,
      .sidebar button.active {
        background: var(--bg3);
        color: var(--text);
      }
      .sidebar button.active {
        color: #ff4444;
        border-left: 3px solid var(--accent);
      }
      .main {
        flex: 1;
        min-width: 0;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }

      .base-url-bar {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .base-url-bar label {
        font-size: 0.75rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        white-space: nowrap;
      }
      .base-url-bar input {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        font-family: monospace;
        font-size: 0.85rem;
      }
      .base-url-bar input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-glow);
      }

      .card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .endpoint-line {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .method-badge {
        background: var(--accent);
        color: #fff;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: 700;
      }
      .path-text {
        font-family: monospace;
        font-size: 0.9rem;
        color: #f0f0f0;
      }
      .param-row {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .param-row label {
        min-width: 80px;
        font-size: 0.8rem;
        color: var(--text-dim);
      }
      .param-row input,
      .param-row select {
        flex: 1;
        min-width: 120px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.5rem;
        border-radius: 4px;
        font-size: 0.85rem;
      }
      .param-row input:focus,
      .param-row select:focus {
        outline: none;
        border-color: var(--accent);
      }
      .btn {
        background: linear-gradient(135deg, #cc0000, #990000);
        color: #fff;
        border: none;
        padding: 0.5rem 1.25rem;
        border-radius: 6px;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.15s;
      }
      .btn:hover {
        box-shadow: 0 4px 12px var(--accent-glow);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: none;
      }

      .resp-area {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.75rem;
        margin-top: 0.5rem;
        font-family: monospace;
        font-size: 0.8rem;
        max-height: 500px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .status-line {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.5rem;
        font-size: 0.8rem;
      }
      .status-ok {
        background: rgba(34, 197, 94, 0.15);
        color: var(--green);
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 700;
      }
      .status-err {
        background: rgba(239, 68, 68, 0.15);
        color: var(--red);
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 700;
      }
      .loading {
        color: var(--accent);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .manga-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 0.75rem;
        margin-top: 0.5rem;
      }
      .manga-card {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.2s;
      }
      .manga-card:hover {
        border-color: var(--accent);
        box-shadow: 0 4px 12px var(--accent-glow);
        transform: translateY(-2px);
      }
      .manga-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }
      .manga-card .info {
        padding: 0.5rem;
      }
      .manga-card .title {
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1.2;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .manga-card .ch {
        font-size: 0.7rem;
        color: var(--text-dim);
        margin-top: 2px;
      }

      .detail-header {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .detail-cover {
        width: 150px;
        border-radius: 8px;
      }
      .detail-meta h2 {
        font-size: 1.2rem;
        margin-bottom: 0.5rem;
      }
      .detail-meta p {
        font-size: 0.8rem;
        color: var(--text-dim);
        margin-bottom: 0.25rem;
      }
      .detail-meta .genres span {
        display: inline-block;
        background: var(--bg3);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        margin-right: 4px;
        margin-top: 4px;
      }

      .chapter-list {
        max-height: 400px;
        overflow-y: auto;
      }
      .chapter-item {
        padding: 0.5rem;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.15s;
        font-size: 0.8rem;
      }
      .chapter-item:hover {
        background: var(--bg3);
      }

      .reader-view {
        text-align: center;
      }
      .reader-view img {
        max-width: 100%;
        height: auto;
        margin-bottom: 4px;
      }
      .reader-nav {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        margin-bottom: 1rem;
      }

      /* ── Mobile Responsiveness ── */
      @media (max-width: 768px) {
        .header {
          padding: 0.5rem 1rem;
          flex-wrap: wrap;
          justify-content: space-between;
          position: relative;
        }
        .header h1 {
          font-size: 0.85rem;
        }

        /* ── Hamburger toggle ── */
        .menu-toggle {
          display: block;
          background: transparent;
          border: 1px solid var(--border);
          border-radius: 6px;
          color: var(--text);
          font-size: 1.2rem;
          padding: 0.25rem 0.6rem;
          cursor: pointer;
          transition: all 0.15s ease;
          line-height: 1;
        }
        .menu-toggle:hover {
          border-color: var(--accent);
          color: var(--accent);
          background: rgba(204, 0, 0, 0.1);
        }

        /* ── Backdrop overlay ── */
        .menu-backdrop {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.6);
          z-index: 998;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.3s ease;
        }
        .menu-backdrop.active {
          opacity: 1;
          pointer-events: auto;
        }

        .container {
          flex-direction: row;
          padding: 0.75rem 0.5rem;
          gap: 0.5rem;
        }

        /* ── Sidebar as slide-out drawer ── */
        .sidebar {
          position: fixed;
          top: 0;
          left: -100%;
          width: 80%;
          max-width: 280px;
          height: 100vh;
          height: 100dvh;
          z-index: 999;
          background: var(--bg);
          border-right: 2px solid var(--border);
          border-bottom: none;
          padding-top: 3.5rem;
          padding-bottom: 2rem;
          overflow-y: auto;
          transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
          box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
        }
        .sidebar.open {
          left: 0;
        }
        .sidebar button {
          width: 100%;
          text-align: left;
          padding: 0.75rem 1rem;
        }

        .main-content {
          width: 100% !important;
        }
        .endpoint-card {
          padding: 0.75rem;
        }
        .endpoint-card h3 {
          font-size: 0.9rem;
        }
        .resp-area {
          font-size: 0.7rem;
          overflow-x: auto;
          white-space: pre-wrap;
          word-break: break-all;
        }
        .manga-grid {
          grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
          gap: 0.5rem;
        }
        .manga-card .title {
          font-size: 0.75rem;
        }
        .detail-header {
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        .detail-cover {
          width: 120px;
        }
        .detail-meta h2 {
          font-size: 1rem;
        }
        .chapter-list {
          max-height: 250px;
        }
        .base-url-bar {
          padding: 0.5rem !important;
        }
        .base-url-bar input {
          font-size: 0.8rem !important;
          padding: 6px 8px !important;
        }
      }

      @media (max-width: 480px) {
        .header {
          padding: 0.4rem 0.75rem;
        }
        .header h1 {
          font-size: 0.75rem;
        }
        .tag {
          font-size: 0.6rem;
          padding: 1px 5px;
        }
        .menu-toggle {
          font-size: 1rem;
          padding: 0.2rem 0.5rem;
        }
        .container {
          padding: 0.5rem 0.25rem;
        }
        .endpoint-card {
          padding: 0.5rem;
        }
        .endpoint-card h3 {
          font-size: 0.8rem;
        }
        .manga-grid {
          grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        }
        .resp-area {
          font-size: 0.65rem;
        }
        .detail-cover {
          width: 100px;
        }
        .sidebar {
          width: 85%;
          max-width: 260px;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>anikuro api playground</h1>
      <span class="tag">interactive</span>
      <!-- Hamburger toggle for mobile -->
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" onclick="toggleMenu()">☰</button>
    </div>

    <!-- Backdrop overlay for mobile -->
    <div class="menu-backdrop" id="menuBackdrop" onclick="toggleMenu()"></div>

    <div
      class="base-url-bar"
      style="max-width: 1200px; margin: 1rem auto 0; padding: 0.75rem 1rem"
    >
      <label>base url</label>
      <input
        type="text"
        id="baseUrl"
        value=""
        placeholder="detecting base url..."
      />
    </div>

    <div class="container">
      <div class="sidebar" id="sidebar">
        <span
          style="
            display: block;
            color: var(--text-dim);
            font-size: 0.75rem;
            padding: 0.6rem 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
          "
          >manga</span
        >
        <button class="active" onclick="show('list', this)">manga list</button>
        <button onclick="show('search', this)">search</button>
        <button onclick="show('detail', this)">manga detail</button>
        <button onclick="show('reader', this)">chapter reader</button>
        <span
          style="
            display: block;
            color: var(--text-dim);
            font-size: 0.75rem;
            padding: 0.6rem 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
          "
          >anime</span
        >
        <button onclick="show('anime-airing', this)">airing</button>
        <button onclick="show('anime-search', this)">search</button>
        <button onclick="show('anime-list', this)">list</button>
        <button onclick="show('anime-detail', this)">anime detail</button>
        <button onclick="show('anime-releases', this)">releases</button>
        <button onclick="show('anime-streaming', this)">streaming</button>
        <span
          style="
            display: block;
            color: var(--text-dim);
            font-size: 0.75rem;
            padding: 0.6rem 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
          "
          >other</span
        >
        <button onclick="show('raw', this)">raw json</button>
      </div>

      <div class="main">
        <!-- LIST PANEL -->
        <div class="panel active" id="panel-list">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/manga/list</span>
            </div>
            <div class="param-row">
              <label>category</label>
              <select id="list-cat">
                <option value="">all</option>
                <option value="action">action</option>
                <option value="adventure">adventure</option>
                <option value="comedy">comedy</option>
                <option value="drama">drama</option>
                <option value="fantasy">fantasy</option>
                <option value="romance">romance</option>
                <option value="scifi">sci-fi</option>
                <option value="mystery">mystery</option>
                <option value="horror">horror</option>
                <option value="isekai">isekai</option>
                <option value="slice+of+life">slice of life</option>
                <option value="sports">sports</option>
              </select>
            </div>
            <div class="param-row">
              <label>page</label>
              <input
                type="number"
                id="list-page"
                value="1"
                min="1"
                style="max-width: 80px"
              />
            </div>
            <button class="btn" onclick="fetchList()">fetch</button>
          </div>
          <div id="list-output"></div>
        </div>

        <!-- SEARCH PANEL -->
        <div class="panel" id="panel-search">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/manga/search/:query</span>
            </div>
            <div class="param-row">
              <label>query</label>
              <input
                type="text"
                id="search-q"
                value="attack on titan"
                placeholder="search term"
              />
            </div>
            <div class="param-row">
              <label>page</label>
              <input
                type="number"
                id="search-page"
                value="1"
                min="1"
                style="max-width: 80px"
              />
            </div>
            <button class="btn" onclick="fetchSearch()">search</button>
          </div>
          <div id="search-output"></div>
        </div>

        <!-- DETAIL PANEL -->
        <div class="panel" id="panel-detail">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/manga/:id</span>
            </div>
            <div class="param-row">
              <label>manga id</label>
              <input
                type="text"
                id="detail-id"
                value="attack-on-titan"
                placeholder="manga slug"
              />
            </div>
            <button class="btn" onclick="fetchDetail()">fetch</button>
          </div>
          <div id="detail-output"></div>
        </div>

        <!-- READER PANEL -->
        <div class="panel" id="panel-reader">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/manga/:id/:ch</span>
            </div>
            <div class="param-row">
              <label>manga id</label>
              <input
                type="text"
                id="reader-manga"
                value="attack-on-titan"
                placeholder="manga slug"
              />
            </div>
            <div class="param-row">
              <label>chapter</label>
              <input
                type="text"
                id="reader-ch"
                value="chapter-139"
                placeholder="chapter slug"
              />
            </div>
            <button class="btn" onclick="fetchChapter()">load chapter</button>
          </div>
          <div id="reader-output"></div>
        </div>

        <!-- ANIME AIRING PANEL -->
        <div class="panel" id="panel-anime-airing">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/anime/airing</span>
            </div>
            <div class="param-row">
              <label>page</label>
              <input
                type="number"
                id="anime-airing-page"
                value="1"
                min="1"
                style="max-width: 80px"
              />
            </div>
            <button class="btn" onclick="fetchAnimeAiring()">fetch</button>
          </div>
          <div id="anime-airing-output"></div>
        </div>

        <!-- ANIME SEARCH PANEL -->
        <div class="panel" id="panel-anime-search">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/anime/search?q=</span>
            </div>
            <div class="param-row">
              <label>query</label>
              <input
                type="text"
                id="anime-search-q"
                value="naruto"
                placeholder="search term"
              />
            </div>
            <div class="param-row">
              <label>page</label>
              <input
                type="number"
                id="anime-search-page"
                value="1"
                min="1"
                style="max-width: 80px"
              />
            </div>
            <button class="btn" onclick="fetchAnimeSearch()">search</button>
          </div>
          <div id="anime-search-output"></div>
        </div>

        <!-- ANIME LIST PANEL -->
        <div class="panel" id="panel-anime-list">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/anime/list</span>
            </div>
            <div class="param-row">
              <label>tab</label>
              <input
                type="text"
                id="anime-list-tab"
                value="A"
                placeholder="A-Z letter"
                style="max-width: 80px"
              />
            </div>
            <div class="param-row">
              <label>genre</label>
              <input
                type="text"
                id="anime-list-genre"
                value="action"
                placeholder="e.g. action"
              />
            </div>
            <div class="param-row">
              <label>page</label>
              <input
                type="number"
                id="anime-list-page"
                value="1"
                min="1"
                style="max-width: 80px"
              />
            </div>
            <button class="btn" onclick="fetchAnimeList()">fetch</button>
          </div>
          <div id="anime-list-output"></div>
        </div>

        <!-- ANIME DETAIL PANEL -->
        <div class="panel" id="panel-anime-detail">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/anime/:id</span>
            </div>
            <div class="param-row">
              <label>anime id</label>
              <input
                type="text"
                id="anime-detail-id"
                value=""
                placeholder="search anime first, then click result"
              />
            </div>
            <button class="btn" onclick="fetchAnimeDetail()">fetch</button>
          </div>
          <div id="anime-detail-output"></div>
        </div>

        <!-- ANIME RELEASES PANEL -->
        <div class="panel" id="panel-anime-releases">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>
              <span class="path-text">/api/anime/:id/releases</span>
            </div>
            <div class="param-row">
              <label>anime id</label>
              <input
                type="text"
                id="anime-releases-id"
                value=""
                placeholder="from search/detail result"
              />
            </div>
            <div class="param-row">
              <label>sort</label>
              <select id="anime-releases-sort">
                <option value="episode_desc">episode desc</option>
                <option value="episode_asc">episode asc</option>
              </select>
            </div>
            <div class="param-row">
              <label>page</label>
              <input
                type="number"
                id="anime-releases-page"
                value="1"
                min="1"
                style="max-width: 80px"
              />
            </div>
            <button class="btn" onclick="fetchAnimeReleases()">fetch</button>
          </div>
          <div id="anime-releases-output"></div>
        </div>

        <!-- ANIME STREAMING PANEL -->
        <div class="panel" id="panel-anime-streaming">
          <div class="card">
            <div class="endpoint-line">
              <span class="method-badge">GET</span>

              <input

              <input
                type="text"

        <!-- RAW JSON PANEL -->
        <div class="panel" id="panel-raw">
          <div class="card">
            <div class="param-row">
              <label>endpoint</label>
              <input
                type="text"
                id="raw-url"
                value="/api/manga/list"
                placeholder="/api/manga/list"
              />

    </div>

    <script>
      function base() {
        return document.getElementById("baseUrl").value.replace(/\/$/, "");
      }

      // Validate base URL before making requests
      function validateBaseURL() {
        var url = base();
        if (!url) {
          alert("Please enter a base URL (e.g., http://localhost:7860)");
          return false;
        }
        if (!url.startsWith("http://") && !url.startsWith("https://")) {
          alert("Base URL must start with http:// or https://");
          return false;
        }
        return true;
      }

      function show(name, btn) {
        document
          .querySelectorAll(".panel")
          .forEach((p) => p.classList.remove("active"));
        document
          .querySelectorAll(".sidebar button")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById("panel-" + name).classList.add("active");
        if (btn) btn.classList.add("active");

        // Close sidebar on mobile after selecting an endpoint
        if (window.innerWidth <= 768) {
          closeMenu();
        }
      }

      /* ── Mobile menu toggle ── */
      function toggleMenu() {
        var sidebar = document.getElementById("sidebar");
        var backdrop = document.getElementById("menuBackdrop");
        var toggle = document.getElementById("menuToggle");
        sidebar.classList.toggle("open");
        backdrop.classList.toggle("active");
        toggle.textContent = sidebar.classList.contains("open") ? "✕" : "☰";
      }

      function closeMenu() {
        var sidebar = document.getElementById("sidebar");
        var backdrop = document.getElementById("menuBackdrop");
        var toggle = document.getElementById("menuToggle");
        sidebar.classList.remove("open");
        backdrop.classList.remove("active");
        toggle.textContent = "☰";
      }
      function statusHTML(ok, status, time) {
        return (
          '<div class="status-line"><span class="' +
          (ok ? "status-ok" : "status-err") +
          '">' +
          status +
          '</span><span style="color:#888">' +
          time +
          "ms</span></div>"
        );
      }
      function loading() {
        return '<div class="status-line"><span class="loading">fetching...</span></div>';
      }
      function normalizeImageUrl(url) {
        if (!url) return "";
        if (url.indexOf("//") === 0) return "https:" + url;
        return url;
      }
      function getAnimeImageHost(url) {
        try {
          return new URL(normalizeImageUrl(url)).host.toLowerCase();
        } catch (e) {
          return "";
        }
      }
      function logAnimeImage(url, context) {
        var normalized = normalizeImageUrl(url);
        if (!normalized) return;
        console.log(
          "[playground:image]",
          context || "anime",
          getAnimeImageHost(normalized),
          normalized,
        );
      }
      function getAnimeImage(obj) {
        return normalizeImageUrl(
          (obj &&
            (obj.image ||
              obj.poster ||
              obj.snapshot ||
              obj.imageUrl ||
              obj.thumbnail)) ||
            "",
        );
      }
      function renderAnimeImage(url, extraStyle, context) {
        var img = normalizeImageUrl(url);
        if (!img) return "";
        logAnimeImage(img, context);
        var style = extraStyle ? ' style="' + extraStyle + '"' : "";
        return (
          '<img src="' +
          img +
          '" loading="lazy"' +
          style +
          ' onerror="console.warn(\'[playground:image:error]\', this.currentSrc || this.src); this.style.display=\'none\'">'
        );
      }
      function errHTML(e) {
        var msg = e || "Unknown error";
        // Provide helpful hints for common errors
        if (
          msg.indexOf("Failed to fetch") !== -1 ||
          msg.indexOf("NetworkError") !== -1
        ) {
          msg +=
            "<br><br><strong>💡 Tip:</strong> Make sure the server is running locally:<br>" +
            "<code style='color:#22c55e'>cd unified && npm start</code><br><br>" +
            "Or change base URL to: <code style='color:#22c55e'>http://localhost:7860</code>";
        } else if (
          msg.indexOf("Unexpected token") !== -1 ||
          msg.indexOf("JSON.parse") !== -1
        ) {
          msg +=
            "<br><br><strong>💡 Tip:</strong> Server returned HTML instead of JSON. Check if the URL is correct.";
        }
        return (
          statusHTML(false, "ERROR", 0) +
          '<div class="resp-area">' +
          msg +
          "</div>"
        );
      }

      function mangaGridHTML(list) {
        if (!list || !list.length)
          return '<p style="color:#888;margin-top:1rem">no results found</p>';
        let html = '<div class="manga-grid">';
        list.forEach(function (m) {
          var img = m.image || m.imageUrl || "";
          var title = m.title || m.name || "unknown";
          var ch = m.chapter || m.currentChapter || "";
          html +=
            '<div class="manga-card" onclick="openDetail(\'' +
            (m.id || "") +
            "')\">";
          if (img)
            html +=
              '<img src="' +
              img +
              '" loading="lazy" onerror="this.style.display=\'none\'">';
          html += '<div class="info"><div class="title">' + title + "</div>";
          if (ch) html += '<div class="ch">' + ch + "</div>";
          html += "</div></div>";
        });
        html += "</div>";
        return html;
      }

      /* LIST */
      function fetchList() {
        if (!validateBaseURL()) return;
        var cat = document.getElementById("list-cat").value;
        var page = document.getElementById("list-page").value;
        var params = "?page=" + page;
        if (cat) params += "&category=" + cat;
        var url = base() + "/api/manga/list" + params;
        document.getElementById("list-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text().then(function (text) {
              try {
                var d = JSON.parse(text);
                return [r, d];
              } catch (e) {
                throw new Error(
                  "Invalid JSON response: " + text.substring(0, 100),
                );
              }
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            document.getElementById("list-output").innerHTML =
              statusHTML(r.ok, r.status, ms) + mangaGridHTML(d.mangaList);
          })
          .catch(function (e) {
            document.getElementById("list-output").innerHTML = errHTML(
              e.message,
            );
          });
      }

      /* SEARCH */
      function fetchSearch() {
        if (!validateBaseURL()) return;
        var q = encodeURIComponent(document.getElementById("search-q").value);
        var page = document.getElementById("search-page").value;
        var url = base() + "/api/manga/search/" + q + "?page=" + page;
        document.getElementById("search-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text().then(function (text) {
              try {
                var d = JSON.parse(text);
                return [r, d];
              } catch (e) {
                throw new Error(
                  "Invalid JSON response: " + text.substring(0, 100),
                );
              }
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            document.getElementById("search-output").innerHTML =
              statusHTML(r.ok, r.status, ms) + mangaGridHTML(d.mangaList);
          })
          .catch(function (e) {
            document.getElementById("search-output").innerHTML = errHTML(
              e.message,
            );
          });
      }

      /* DETAIL */
      function openDetail(id) {
        show("detail");
        document.getElementById("detail-id").value = id;
        fetchDetail();
      }

      function fetchDetail() {
        if (!validateBaseURL()) return;
        var id = document.getElementById("detail-id").value;
        var url = base() + "/api/manga/" + id;
        document.getElementById("detail-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text().then(function (text) {
              try {
                var d = JSON.parse(text);
                return [r, d];
              } catch (e) {
                throw new Error("Invalid JSON: " + text.substring(0, 100));
              }
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            var html = statusHTML(r.ok, r.status, ms);

            if (d.name) {
              html += '<div class="card"><div class="detail-header">';
              if (d.imageUrl)
                html +=
                  '<img class="detail-cover" referrerpolicy="no-referrer" src="' +
                  d.imageUrl +
                  '" onerror="this.style.display=\'none\'">';
              html += '<div class="detail-meta"><h2>' + d.name + "</h2>";
              if (d.author)
                html += "<p><strong>author:</strong> " + d.author + "</p>";
              if (d.status)
                html += "<p><strong>status:</strong> " + d.status + "</p>";
              if (d.updated)
                html += "<p><strong>updated:</strong> " + d.updated + "</p>";
              if (d.genres)
                html +=
                  '<div class="genres">' +
                  d.genres
                    .map(function (g) {
                      return "<span>" + g + "</span>";
                    })
                    .join("") +
                  "</div>";
              html += "</div></div>";

              if (d.chapterList && d.chapterList.length) {
                html +=
                  '<h3 style="margin-bottom:0.5rem;font-size:0.95rem;">chapters (' +
                  d.chapterList.length +
                  ")</h3>";
                html += '<div class="chapter-list">';
                d.chapterList.forEach(function (ch) {
                  html +=
                    '<div class="chapter-item" onclick="openChapter(\'' +
                    id +
                    "','" +
                    ch.id +
                    "')\">";
                  html += ch.name || ch.id;
                  if (ch.view)
                    html +=
                      ' <span style="color:#888">(' + ch.view + ")</span>";
                  html += "</div>";
                });
                html += "</div>";
              }
              html += "</div>";
            } else {
              html +=
                '<div class="resp-area">' +
                JSON.stringify(d, null, 2) +
                "</div>";
            }
            document.getElementById("detail-output").innerHTML = html;
          })
          .catch(function (e) {
            document.getElementById("detail-output").innerHTML = errHTML(
              e.message,
            );
          });
      }

      /* CHAPTER / READER */
      function openChapter(mangaId, chId) {
        show("reader");
        document.getElementById("reader-manga").value = mangaId;
        document.getElementById("reader-ch").value = chId;
        fetchChapter();

      function fetchChapter() {
        if (!validateBaseURL()) return;
        var mangaId = document.getElementById("reader-manga").value;
        var chId = document.getElementById("reader-ch").value;
        var url = base() + "/api/manga/" + mangaId + "/" + chId;
        document.getElementById("reader-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text().then(function (text) {
              try {
                var d = JSON.parse(text);
                return [r, d];
              } catch (e) {
                throw new Error("Invalid JSON: " + text.substring(0, 100));
              }
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            var html = statusHTML(r.ok, r.status, ms);

              html += '<div class="card">';
              html += '<h3 style="margin-bottom:0.5rem">' + d.title + "</h3>";

              if (d.images && d.images.length) {

                d.images.forEach(function (img) {
                  html +=

                    '" loading="lazy" referrerpolicy="no-referrer">';
                });
                html += "</div>";

                html +=
                  '<div class="resp-area">' +
                  JSON.stringify(d, null, 2) +
                  "</div>";

            document.getElementById("reader-output").innerHTML = html;

          .catch(function (e) {
            document.getElementById("reader-output").innerHTML = errHTML(
              e.message,

          });

      /* ANIME AIRING */

                html += "</div></div>";

              html += "</div></div>";
            } else {
              html +=
                '<p style="color:#888;margin-top:1rem">no results found</p>';

            document.getElementById("anime-airing-output").innerHTML = html;
          })
          .catch(function (e) {
            document.getElementById("anime-airing-output").innerHTML = errHTML(
              e.message,
            );
          });
      }

      /* ANIME SEARCH */

        var genre = document.getElementById("anime-list-genre").value;
        var page = document.getElementById("anime-list-page").value;

        if (genre) params += "&genre=" + genre;
        var url = base() + "/api/anime/list" + params;
        document.getElementById("anime-list-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text().then(function (text) {
              try {
                var d = JSON.parse(text);
                return [r, d];
              } catch (e) {
                throw new Error("Invalid JSON: " + text.substring(0, 100));
              }
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            var html = statusHTML(r.ok, r.status, ms);

            // Handle both raw array and wrapped response
            var animeList = Array.isArray(d) ? d : d.data || d.results || [];
            if (animeList.length) {
              html += '<div class="card"><div class="manga-grid">';
              animeList.forEach(function (anime) {
                var img = getAnimeImage(anime);
                var title = anime.title || "unknown";

                var id = "";

                  var urlParts = anime.url.split("/anime/");
                  id = urlParts[1] || "";
                } else {
                  id = anime.session || anime.id || "";

                  '<div class="manga-card" onclick="openAnimeDetail(\'' +

          });
      }

      /* ANIME RELEASES */
      function fetchAnimeReleases() {
        if (!validateBaseURL()) return;
        var id = document.getElementById("anime-releases-id").value;
        var sort = document.getElementById("anime-releases-sort").value;
        var page = document.getElementById("anime-releases-page").value;
        var url =
          base() +
          "/api/anime/" +
          id +
          "/releases?sort=" +
          sort +
          "&page=" +
          page;
        document.getElementById("anime-releases-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text().then(function (text) {
              try {
                var d = JSON.parse(text);
                return [r, d];
              } catch (e) {
                throw new Error("Invalid JSON: " + text.substring(0, 100));
              }
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            var html = statusHTML(r.ok, r.status, ms);

            if (d.data && d.data.length) {
              html += '<div class="card">';
              html +=
                '<h3 style="margin-bottom:0.5rem;font-size:0.95rem;">episodes (' +
                d.data.length +
                ")</h3>";
              html += '<div class="chapter-list">';
              d.data.forEach(function (ep) {
                var epId = ep.session || ep.id || "";
                var epNum = ep.episode || "unknown";
                var dur = ep.duration || "";
                var thumb = getAnimeImage(ep);
                html +=
                  '<div class="chapter-item" onclick="openAnimeEpisode(\'' +
                  id +
                  "','" +
                  epId +
                  "')\">";
                if (thumb)
                  html += renderAnimeImage(
                    thumb,
                    "width:72px;height:72px;object-fit:cover;border-radius:10px;margin-right:0.85rem;flex-shrink:0;",
                    "anime-release",
                  );
                html += '<div style="display:flex;flex-direction:column;min-width:0;">';
                html += "Episode " + epNum;
                if (dur)
                  html += ' <span style="color:#888">(' + dur + ")</span>";
                html += "</div></div>";
              });
              html += "</div></div>";
            } else {
              html +=
                '<p style="color:#888;margin-top:1rem">no episodes found</p>';
            }
            document.getElementById("anime-releases-output").innerHTML = html;
          })
          .catch(function (e) {
            document.getElementById("anime-releases-output").innerHTML =
              errHTML(e.message);
          });
      }

      /* ANIME EPISODE / STREAMING */
      function openAnimeEpisode(animeId, epId) {
        show("anime-streaming");
        document.getElementById("anime-streaming-id").value = animeId;
        document.getElementById("anime-streaming-ep").value = epId;
        fetchAnimeStreaming();
      }

      function fetchAnimeStreaming() {
        if (!validateBaseURL()) return;
        var animeId = document.getElementById("anime-streaming-id").value;
        var epId = document.getElementById("anime-streaming-ep").value;
        var url = base() + "/api/anime/" + animeId + "/" + epId;
        document.getElementById("anime-streaming-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text().then(function (text) {
              try {
                var d = JSON.parse(text);
                return [r, d];
              } catch (e) {
                throw new Error("Invalid JSON: " + text.substring(0, 100));
              }
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            var html = statusHTML(r.ok, r.status, ms);

            if (d.title || d.episode) {
              html += '<div class="card">';
              html +=
                '<h3 style="margin-bottom:0.5rem">' +
                (d.title || "Episode " + (d.episode || "")) +
                "</h3>";

              if (d.sources && d.sources.length) {
                html +=
                  '<h4 style="margin-top:1rem;margin-bottom:0.5rem;font-size:0.85rem;">streaming sources</h4>';
                html += '<div class="resp-area">';
                d.sources.forEach(function (src, idx) {
                  html += "<div><strong>source " + (idx + 1) + "</strong>";
                  if (src.url || src.src)
                    html +=
                      '<br><span style="color:#22c55e">' +
                      (src.url || src.src) +
                      "</span>";
                  if (src.type) html += "<br>type: " + src.type;
                  if (src.resolution)
                    html += "<br>resolution: " + src.resolution;
                  if (src.fanSub || src.fansub)
                    html += "<br>fansub: " + (src.fanSub || src.fansub);
                  if (src.download)
                    html +=
                      '<br>download: <span style="color:#22c55e">' +
                      src.download +
                      "</span>";
                  if (src.downloadHeaders)
                    html +=
                      "<br>download headers: " +
                      JSON.stringify(src.downloadHeaders);
                  html += "</div><br>";
                });
                html += "</div>";
              } else if (d.sources) {
                html +=
                  '<div class="resp-area">' +
                  JSON.stringify(d.sources, null, 2) +
                  "</div>";
              }

              if (d.downloads && d.downloads.length) {
                html +=
                  '<h4 style="margin-top:1rem;margin-bottom:0.5rem;font-size:0.85rem;">download links</h4>';
                html += '<div class="resp-area">';
                d.downloads.forEach(function (link) {
                  html +=
                    "<div><strong>" +
                    (link.quality || link.resolution || "unknown") +
                    "</strong>";
                  if (link.download || link.url)
                    html +=
                      '<br><span style="color:#22c55e">' +
                      (link.download || link.url) +
                      "</span>";
                  if (link.pahe)
                    html += "<br>pahe: " + link.pahe;
                  if (link.downloadHeaders)
                    html +=
                      "<br>download headers: " +
                      JSON.stringify(link.downloadHeaders);
                  html += "</div><br>";
                });
                html += "</div>";
              }

              if (!d.sources && !d.downloads) {
                html +=
                  '<div class="resp-area">' +
                  JSON.stringify(d, null, 2) +
                  "</div>";
              }
              html += "</div>";
            } else {
              html +=
                '<div class="resp-area">' +
                JSON.stringify(d, null, 2) +
                "</div>";
            }
            document.getElementById("anime-streaming-output").innerHTML = html;
          })
          .catch(function (e) {
            document.getElementById("anime-streaming-output").innerHTML =
              errHTML(e.message);
          });
      }

      /* RAW */
      function fetchRaw() {
        if (!validateBaseURL()) return;
        var path = document.getElementById("raw-url").value;
        var url = base() + path;
        document.getElementById("raw-output").innerHTML = loading();
        var t0 = performance.now();
        fetch(url)
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text().then(function (text) {
              try {
                var d = JSON.parse(text);
                return [r, d];
              } catch (e) {
                throw new Error("Invalid JSON: " + text.substring(0, 100));
              }
            });
          })
          .then(function (arr) {
            var r = arr[0],
              d = arr[1];
            var ms = Math.round(performance.now() - t0);
            document.getElementById("raw-output").innerHTML =
              statusHTML(r.ok, r.status, ms) +
              '<div class="resp-area">' +
              JSON.stringify(d, null, 2) +
              "</div>";
          })
          .catch(function (e) {
            document.getElementById("raw-output").innerHTML = errHTML(
              e.message,
            );
          });
      }

      /* initial load */
      fetchList();

      /* ── Auto-detect base URL ── */
      (function setBaseUrl() {
        var input = document.getElementById("baseUrl");
        if (!input) return;
        var host = window.location.hostname;
        var port = window.location.port;
        if (host === "localhost" || host === "127.0.0.1" || host === "0.0.0.0") {
          input.value = "http://localhost:" + (port || "7860");
        } else if (host && host !== "") {
          input.value = window.location.protocol + "//" + host + (port ? ":" + port : "");
        } else {
          input.value = "http://localhost:7860";
        }
        // Update placeholder to reflect current host
        input.placeholder = "e.g., " + input.value;
      })();
    </script>
  </body>
</html>
